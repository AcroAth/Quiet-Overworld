<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Quiet Overworld · audio check</title>
    <style>
      body { margin: 0; padding: 20px; background: #0f1019; color: #e9e9ed; font: 14px/1.5 system-ui, sans-serif; }
      h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
      li { margin: 6px 0; overflow-wrap: anywhere; }
      .ok { color: #9be39b; } .bad { color: #f0a8a0; } .info { color: #b2b6ca; }
    </style>
  </head>
  <body>
    <h1>Audio check</h1>
    <p class="info">Wait until it says "Done", then take a screenshot.</p>
    <ul id="out"></ul>
    <script type="module">
      // Finds out how this browser can play Minecraft's music files.
      const out = document.getElementById("out");
      const line = (cls, text) => {
        const li = document.createElement("li");
        li.className = cls;
        li.textContent = text;
        out.append(li);
      };
      const withTimeout = (promise, ms) =>
        Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("timed out")), ms))]);

      function loadInto(src) {
        return withTimeout(
          new Promise((resolve, reject) => {
            const audio = document.createElement("audio");
            audio.preload = "auto";
            audio.addEventListener("loadedmetadata", () => resolve(audio.duration));
            audio.addEventListener("error", () => reject(new Error(`media error ${audio.error?.code}`)));
            audio.src = src;
            audio.load();
          }),
          15000,
        );
      }

      line("info", navigator.userAgent);
      for (const type of ['audio/ogg; codecs="vorbis"', "audio/ogg", 'audio/webm; codecs="vorbis"', 'audio/ogg; codecs="opus"']) {
        const answer = document.createElement("audio").canPlayType(type);
        line(answer ? "ok" : "bad", `canPlayType(${type}): "${answer}"`);
      }

      const catalog = await fetch("catalog.json").then((r) => r.json());
      const entry = catalog.events["music.game"][0];
      const hash = catalog.tracks[entry.path].hash;
      const url = `https://resources.download.minecraft.net/${hash.slice(0, 2)}/${hash}`;
      line("info", `Track: ${catalog.tracks[entry.path].title} (${catalog.version})`);

      try {
        line("ok", `A. Direct <audio>: plays, ${Math.round(await loadInto(url))} s`);
      } catch (e) {
        line("bad", `A. Direct <audio>: ${e.message}`);
      }

      let bytes = null;
      try {
        const response = await withTimeout(fetch(url, { mode: "cors" }), 30000);
        bytes = await response.arrayBuffer();
        line("ok", `B. Page download: allowed, HTTP ${response.status}, ${response.headers.get("content-type")}, ${bytes.byteLength} bytes`);
      } catch (e) {
        line("bad", `B. Page download: blocked (${e.message})`);
      }

      if (bytes) {
        try {
          const blob = URL.createObjectURL(new Blob([bytes], { type: "audio/ogg" }));
          line("ok", `C. Labelled as audio/ogg: plays, ${Math.round(await loadInto(blob))} s`);
        } catch (e) {
          line("bad", `C. Labelled as audio/ogg: ${e.message}`);
        }
        try {
          const context = new (window.AudioContext || window.webkitAudioContext)();
          const decoded = await withTimeout(context.decodeAudioData(bytes.slice(0)), 30000);
          line("ok", `D. Web Audio decode: works, ${Math.round(decoded.duration)} s, ${decoded.sampleRate} Hz`);
        } catch (e) {
          line("bad", `D. Web Audio decode: ${e?.message ?? e}`);
        }
      }
      line("info", "Done");
    </script>
  </body>
</html>
