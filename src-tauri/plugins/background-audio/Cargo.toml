[package]
name = "tauri-plugin-background-audio"
version = "0.1.0"
description = "Keeps Quiet Overworld playing while it is in the background on phones"
edition = "2021"
publish = false
links = "tauri-plugin-background-audio"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
