[package]
name = "quiet-overworld"
version = "0.1.0"
description = "Minecraft's music, without the game"
authors = ["AcroAth"]
repository = "https://github.com/AcroAth/Quiet-Overworld"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "quiet_overworld_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "mp3", "flac", "wav"] }
ureq = "3"
sha1_smol = "1"
fastrand = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
